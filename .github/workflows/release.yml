name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run cross-platform checks
        run: |
          python scripts/validate_skill.py .
          python scripts/trigger_eval.py . --cases evals/trigger_cases.json
          python -m unittest discover -s tests -v
          python scripts/assess_interview.py assets/example-interview-ledger.json
          python scripts/validate_resume.py assets/example-resume.json

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate tagged source
        run: python scripts/validate_skill.py .

      - name: Read release version from tag
        id: package-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Release tags must use the vX.Y.Z format."
            exit 1
          fi

      - name: Run release checks
        run: |
          python scripts/trigger_eval.py . --cases evals/trigger_cases.json
          python -m unittest discover -s tests -v
          python scripts/assess_interview.py assets/example-interview-ledger.json
          python scripts/validate_resume.py assets/example-resume.json

      - name: Build minimal runtime package
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          root = Path.cwd()
          package_name = "starline-campus-resume"
          staging = root / "dist" / package_name
          archive = root / "dist" / f"{package_name}-{version}.zip"
          runtime_files = [
              "SKILL.md",
              "manifest.json",
              "requirements.txt",
              "agents/interface.yaml",
              "scripts/assess_interview.py",
              "scripts/extract_resume.py",
              "scripts/render_resume.py",
              "scripts/validate_resume.py",
              "scripts/validate_skill.py",
              "scripts/validate_style_set.py",
          ]
          runtime_files.extend(path.relative_to(root).as_posix() for path in sorted((root / "references").glob("*.md")))

          shutil.rmtree(staging, ignore_errors=True)
          for relative in runtime_files:
              source = root / relative
              if not source.is_file():
                  raise SystemExit(f"Missing runtime file: {relative}")
              target = staging / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          manifest_path = staging / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest["publication"] = re.sub(
              r"release v\d+\.\d+\.\d+",
              f"release v{version}",
              str(manifest.get("publication", "")),
          )
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")`n
          expected = {f"{package_name}/{relative}" for relative in runtime_files}
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
              for relative in runtime_files:
                  bundle.write(staging / relative, f"{package_name}/{relative}")
          with zipfile.ZipFile(archive) as bundle:
              actual = set(bundle.namelist())
          if actual != expected:
              unexpected = sorted(actual - expected)
              missing = sorted(expected - actual)
              raise SystemExit(f"Unexpected archive entries: {unexpected}; missing archive entries: {missing}")
          print(f"Created minimal runtime package: {archive}")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package-version.outputs.version }}
        shell: bash
        run: |
          notes_file="$(mktemp)"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$notes_file"

          release_args=(
            "$GITHUB_REF_NAME"
            "dist/starline-campus-resume-${VERSION}.zip"
            --title "starline-campus-resume ${VERSION}"
            --generate-notes
          )
          if [[ -s "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          fi
          gh release create "${release_args[@]}"
